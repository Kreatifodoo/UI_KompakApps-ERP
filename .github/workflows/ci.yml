name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ODOO_VERSION: "19.0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Jalankan pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
      - name: Periksa skrip operasional
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y -qq shellcheck
          shellcheck -x scripts/backup.sh scripts/restore.sh scripts/check_backup_restore.sh scripts/ops-lib.sh
          python3 -X pycache_prefix="$RUNNER_TEMP/pyc" -m py_compile scripts/*.py
          python3 -I scripts/healthcheck.py --help >/dev/null
          python3 -I scripts/loadtest.py --help >/dev/null

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: kompakapps:ci
          build-args: ODOO_VERSION=${{ env.ODOO_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Jalankan test Odoo
        run: |
          set -o pipefail
          rc=0
          docker run --rm --network host \
            -e HOST=localhost -e USER=odoo -e PASSWORD=odoo \
            kompakapps:ci \
            odoo -d kompakapps_ci -i kompakapps_base \
              --test-enable --test-tags /kompakapps_base \
              --without-demo=true --stop-after-init --log-level=test \
            2>&1 | tee odoo-test.log || rc=$?
          # Ringkasan di halaman run (terbaca tanpa login ke GitHub).
          {
            echo "### Hasil test Odoo"
            echo
            echo '```'
            grep -E "kompakapps_base|test_smoke|queries" odoo-test.log | tail -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "Odoo keluar dengan kode $rc." >&2
            exit "$rc"
          fi
          # Odoo tidak selalu keluar dengan kode error saat test gagal, jadi periksa lognya.
          if grep -E " (ERROR|CRITICAL) " odoo-test.log; then
            echo "Test Odoo gagal: ada baris ERROR/CRITICAL di log." >&2
            exit 1
          fi
          # Pastikan test benar-benar berjalan, bukan modul yang tidak ditemukan lalu diabaikan.
          if ! grep -qE "test_smoke|kompakapps_base: [0-9]+ tests" odoo-test.log; then
            echo "Tidak ada jejak test kompakapps_base di log; test mungkin tidak berjalan." >&2
            exit 1
          fi
