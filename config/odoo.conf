[options]
; Modul inti Odoo ditemukan otomatis. Daftar di bawah: modul KompakApps + repo OCA (lihat oca.lock).
addons_path = /mnt/extra-addons,/opt/oca/purchase-workflow,/opt/oca/account-financial-tools,/opt/oca/account-financial-reporting,/opt/oca/mis-builder,/opt/oca/account-budgeting,/opt/oca/server-tools,/opt/oca/account-reconcile,/opt/oca/server-ux,/opt/oca/reporting-engine,/opt/oca/web
data_dir = /var/lib/odoo
; Di dalam container Odoo harus mendengarkan semua antarmuka agar port yang dipublikasikan Docker terjangkau.
; (Eksplisit karena bawaan Odoo 20 berubah ke 127.0.0.1.) Akses dari luar host dibatasi di compose.
http_interface = 0.0.0.0
; Sembunyikan database manager. Kata sandi master (admin_passwd) disuntikkan saat container mulai
; dari variabel ADMIN_PASSWD oleh docker/entrypoint.sh; jangan ditulis di berkas ini.
list_db = False
; Aplikasi berjalan di belakang reverse proxy (nginx).
proxy_mode = True
