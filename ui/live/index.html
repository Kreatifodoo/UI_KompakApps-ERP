<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KompakApps</title>
  <meta name="theme-color" content="#0C87A0">
  <link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
  <link rel="apple-touch-icon" href="brand/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* Tema KompakApps (kompakapps.com): skala teal merek menggantikan indigo di seluruh UI, panel gelap memakai teal tua merek, bayangan kartu bernuansa teal. */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            indigo: { 50: "#ECFBFE", 100: "#D0F4FB", 200: "#A6E9F6", 300: "#63DAEF", 400: "#1FC8E6", 500: "#0FA6C4", 600: "#0C87A0", 700: "#0A6B80", 800: "#085463", 900: "#08404A", 950: "#052A32" },
            slate: { 700: "#116C7E", 800: "#0B5361", 900: "#08404A", 950: "#052A32" },
          },
          boxShadow: { sm: "0 1px 2px 0 rgba(8,64,74,.04), 0 1px 3px -1px rgba(8,64,74,.07)" },
          fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"], hand: ["Caveat", "cursive"] },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@300;400;500;600;700;800&display=swap">
  <style>
    /* Tipografi dan warna mengikuti kompakapps.com: Inter, teks utama #102A33, judul teal tua #08404A dengan jarak huruf rapat, aksen tulisan tangan Caveat */
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; background-color: #F4F8F9; color: #102A33; -webkit-font-smoothing: antialiased; }
    h1, h2, h3 { letter-spacing: -0.025em; }
    #app h1 { color: #08404A; font-weight: 800; }
    #app h2 { color: #08404A; font-weight: 700; }
    .font-hand { font-family: 'Caveat', cursive; font-weight: 700; }
    ::selection { background: #D0F4FB; color: #08404A; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    /* Scrollbar sidebar (dari prototipe) */
    .sidebar-scroll::-webkit-scrollbar { width: 4px; }
    .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    .sidebar-scroll::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="flex h-screen bg-gray-50 overflow-hidden">
    <div id="sidebar-overlay" data-action="sidebar-close" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 z-20 lg:hidden"></div>

    <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-30 w-72 bg-slate-900 text-white flex flex-col transition-transform duration-300 ease-in-out lg:translate-x-0 -translate-x-full">
      <div class="h-16 flex items-center justify-between px-6 bg-slate-950 border-b border-slate-800 shrink-0">
        <a href="#/pr" class="flex items-center" aria-label="KompakApps, beranda">
          <img src="brand/kompakapps-logo-white.png" alt="KompakApps" class="h-9 w-auto">
        </a>
        <button data-action="sidebar-close" class="lg:hidden text-gray-400 hover:text-white" aria-label="Tutup menu"><i class="fas fa-times"></i></button>
      </div>
      <nav id="sidebar-nav" class="flex-1 overflow-y-auto sidebar-scroll py-4" aria-label="Menu utama"></nav>
      <div class="p-4 bg-slate-950 border-t border-slate-800 shrink-0">
        <div class="flex items-center text-sm text-slate-400"><i class="fas fa-server mr-2"></i><span id="sidebar-version">Menghubungkan...</span></div>
      </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
      <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-4 lg:px-8 shrink-0 z-20">
        <div class="flex items-center">
          <button data-action="sidebar-open" class="lg:hidden text-gray-500 hover:text-indigo-600 focus:outline-none mr-4" aria-label="Buka menu"><i class="fas fa-bars text-xl"></i></button>
          <div class="relative hidden md:block">
            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input id="menu-search" type="text" autocomplete="off" placeholder="Cari menu..." aria-label="Cari menu"
              class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 w-64 lg:w-96 transition-all">
          </div>
        </div>
        <div id="session" class="flex items-center"></div>
      </header>
      <div class="flex-1 overflow-y-auto">
        <div id="app" class="max-w-6xl p-6 lg:p-8 fade-in" aria-live="polite"></div>
      </div>
    </main>
  </div>
  <div id="toast" class="fixed bottom-4 right-4 z-50 space-y-2 max-w-sm"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
