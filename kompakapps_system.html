        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for sidebar */
        .sidebar-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

                    {

                ]

                            { title: "Aged Receivable" }, { title: "Aged Payable" }, { title: "Tax Report" },

                ]
            },
            {
                title: "General Setting", icon: "fas fa-cog",
                items: [{ title: "Company Setting" }, { title: "Users & Access" }]
            }
        ];

        const MenuItem = ({ item, level = 0, activePath, setActivePath }) => {
            const hasChildren = item.items && item.items.length > 0;
            const isActive = activePath[level] === item.title;
            const isFullyActive = activePath.length - 1 === level && isActive;
            
            // To handle accordion state
            const [isOpen, setIsOpen] = useState(isActive);

            useEffect(() => {
                if (isActive) setIsOpen(true);
            }, [activePath, isActive]);

            const handleClick = () => {
                if (hasChildren) {
                    setIsOpen(!isOpen);
                } else {
                    // Update active path array up to this level
                    const newPath = [...activePath.slice(0, level), item.title];
                    setActivePath(newPath);
                }
            };

            const paddingLeft = level === 0 ? 'px-4' : level === 1 ? 'pl-10 pr-4' : 'pl-14 pr-4';
            
            return (
                <div className="flex flex-col">
                    <button 
                        onClick={handleClick}
                        className={`flex items-center justify-between py-3 ${paddingLeft} transition-colors duration-200 w-full text-left
                            ${isFullyActive && !hasChildren ? 'bg-indigo-600 text-white' : 
                              isActive && hasChildren ? 'bg-slate-800 text-indigo-400' : 
                              'text-slate-300 hover:bg-slate-800 hover:text-white'}
                        `}
                    >
                        <div className="flex items-center">
                            {item.icon && <i className={`${item.icon} w-6 text-center mr-2 text-sm`}></i>}
                            {level > 0 && !item.icon && <div className="w-1.5 h-1.5 rounded-full bg-current mr-3 opacity-50"></div>}
                            <span className={`${level === 0 ? 'font-medium' : 'font-normal'} text-sm`}>{item.title}</span>
                        </div>
                        {hasChildren && (
                            <i className={`fas fa-chevron-down text-xs transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`}></i>
                        )}
                    </button>
                    
                    {/* Render Children */}
                    {hasChildren && (
                        <div className={`overflow-hidden transition-all duration-300 ${isOpen ? 'max-h-[1000px] opacity-100' : 'max-h-0 opacity-0'}`}>
                            <div className="bg-slate-900 border-l border-slate-700 ml-5 my-1">
                                {item.items.map((child, idx) => (
                                    <MenuItem 
                                        key={idx} 
                                        item={child} 
                                        level={level + 1} 
                                        activePath={activePath} 
                                        setActivePath={setActivePath} 
                                    />
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const Header = ({ toggleSidebar }) => (
            <header className="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-4 lg:px-8 sticky top-0 z-20">
                <div className="flex items-center">
                    <button onClick={toggleSidebar} className="lg:hidden text-gray-500 hover:text-indigo-600 focus:outline-none mr-4">
                        <i className="fas fa-bars text-xl"></i>
                    </button>
                    <div className="relative hidden md:block">
                        <i className="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>

                    </div>
                </div>
                
                <div className="flex items-center space-x-4">

                        <i className="far fa-bell text-xl"></i>
                        <span className="absolute top-0 right-0 -mt-1 -mr-1 bg-red-500 text-white text-xs font-bold rounded-full h-4 w-4 flex items-center justify-center">3</span>
                    </button>

                                </button>
                                <button className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 shadow-sm shadow-indigo-200 transition-all">
                                    <i className="fas fa-plus mr-2"></i> Create New
                                </button>
                            </div>

                        <div className="space-y-6">
                            {/* Stats Grid */}

                                    <p className="text-sm font-medium text-gray-500">Total Revenue ({moduleName})</p>

                                </div>

                                    <p className="text-sm font-medium text-gray-500">Active Transactions</p>
                                    <h3 className="text-2xl font-bold text-gray-900 mt-1">1,248</h3>
                                    <p className="text-xs text-green-500 mt-2 flex items-center"><i className="fas fa-arrow-up mr-1"></i> +2.4% from last month</p>
                                </div>
                                <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 border-l-4 border-l-yellow-500">
                                    <p className="text-sm font-medium text-gray-500">Pending Approvals</p>
                                    <h3 className="text-2xl font-bold text-gray-900 mt-1">36</h3>

                                </div>

                                    </div>
                                    <div className="h-64 w-full bg-slate-50 rounded-lg flex items-end justify-between px-6 pt-10 pb-4 border border-dashed border-gray-200">

                                        ))}

                                        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
                                    </div>
                                </div>
                                <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">

                                        <h4 className="text-base font-semibold text-gray-900">Recent Activities</h4>
                                    </div>
                                    <div className="space-y-4">
                                        {[
                                            { t: "Purchase Order #PO-992 Created", d: "2 mins ago", c: "bg-blue-100 text-blue-600", i: "fa-shopping-cart" },
                                            { t: "Inventory Level Critical: Item A", d: "1 hour ago", c: "bg-red-100 text-red-600", i: "fa-exclamation" },

                                                <div className={`w-8 h-8 rounded-full flex items-center justify-center shrink-0 ${act.c}`}>
                                                    <i className={`fas ${act.i} text-xs`}></i>
                                                </div>
                                                <div className="ml-3">
                                                    <p className="text-sm font-medium text-gray-800">{act.t}</p>
                                                    <p className="text-xs text-gray-500 mt-0.5">{act.d}</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <button className="w-full mt-6 py-2 text-sm text-indigo-600 font-medium bg-indigo-50 rounded-lg hover:bg-indigo-100 transition-colors">
                                        View All Activities
                                    </button>
                                </div>
                            </div>
                        </div>
                    ) : (
                        /* Module Data Table Placeholder */
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-gray-50 border-b border-gray-200">
                                            <th className="py-3 px-6 text-xs font-semibold text-gray-600 uppercase tracking-wider">ID</th>
                                            <th className="py-3 px-6 text-xs font-semibold text-gray-600 uppercase tracking-wider">Description</th>
                                            <th className="py-3 px-6 text-xs font-semibold text-gray-600 uppercase tracking-wider">Status</th>
                                            <th className="py-3 px-6 text-xs font-semibold text-gray-600 uppercase tracking-wider">Date</th>
                                            <th className="py-3 px-6 text-xs font-semibold text-gray-600 uppercase tracking-wider text-right">Actions</th>
                                        </tr>
                                    </thead>

                                                <td className="py-4 px-6 text-sm font-medium text-gray-900">#{currentTitle.substring(0,3).toUpperCase()}-{1000 + row}</td>

                                                        {row % 3 === 0 ? 'Pending' : 'Active'}
                                                    </span>
                                                </td>
                                                <td className="py-4 px-6 text-sm text-gray-600">Oct {10 + row}, 2026</td>
                                                <td className="py-4 px-6 text-sm text-right">
                                                    <button className="text-gray-400 hover:text-indigo-600 mx-1"><i className="fas fa-edit"></i></button>
                                                    <button className="text-gray-400 hover:text-red-600 mx-1"><i className="fas fa-trash-alt"></i></button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>

                                    <button className="px-3 py-1 border border-indigo-500 rounded bg-indigo-50 text-indigo-600 font-medium">1</button>
                                    <button className="px-3 py-1 border border-gray-300 rounded bg-white text-gray-700 hover:bg-gray-50">2</button>
                                    <button className="px-3 py-1 border border-gray-300 rounded bg-white text-gray-700 hover:bg-gray-50">Next</button>
                                </div>
                            </div>

            );
        };

        const App = () => {
            // Default active path
            const [activePath, setActivePath] = useState(["Inventory", "Dashboard"]);
            const [sidebarOpen, setSidebarOpen] = useState(true);

            // Close sidebar on mobile initially or when resizing
            useEffect(() => {
                const handleResize = () => {
                    if (window.innerWidth < 1024) {
                        setSidebarOpen(false);
                    } else {
                        setSidebarOpen(true);
                    }
                };
                window.addEventListener('resize', handleResize);
                handleResize(); // Init
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            return (
                <div className="flex h-screen bg-gray-50 overflow-hidden">
                    {/* Mobile Sidebar Overlay */}
                    {!sidebarOpen && window.innerWidth < 1024 && (
                        <div 
                            className="fixed inset-0 bg-gray-900 bg-opacity-50 z-20 lg:hidden"
                            onClick={() => setSidebarOpen(false)}
                        ></div>
                    )}

                    {/* Sidebar */}
                    <aside 
                        className={`fixed lg:static inset-y-0 left-0 z-30 w-72 bg-slate-900 text-white flex flex-col transition-transform duration-300 ease-in-out lg:translate-x-0 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}
                    >
                        {/* Logo Area */}
                        <div className="h-16 flex items-center justify-between px-6 bg-slate-950 border-b border-slate-800 shrink-0">
                            <div className="flex items-center text-xl font-bold tracking-wide">
                                <div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center mr-3 shadow-lg shadow-indigo-500/30">
                                    <i className="fas fa-layer-group text-white text-sm"></i>
                                </div>
                                KompakApps <span className="text-indigo-400 ml-1">ERP</span>
                            </div>
                            <button onClick={() => setSidebarOpen(false)} className="lg:hidden text-gray-400 hover:text-white">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>

                        {/* Navigation Menu */}
                        <nav className="flex-1 overflow-y-auto sidebar-scroll py-4">
                            <div className="px-4 pb-2 mb-2">
                                <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Main Modules</p>
                            </div>
                            {menuData.map((item, idx) => (
                                <MenuItem 
                                    key={idx} 
                                    item={item} 
                                    activePath={activePath} 
                                    setActivePath={setActivePath} 
                                />
                            ))}
                        </nav>
                        
                        {/* Sidebar Footer */}
                        <div className="p-4 bg-slate-950 border-t border-slate-800 shrink-0">
                            <div className="flex items-center text-sm text-slate-400">
                                <i className="fas fa-server mr-2"></i> v2.0.4 - Enterprise
                            </div>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col min-w-0 overflow-hidden">

                        <div className="flex-1 overflow-y-auto">

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
