# Lingkungan pengembangan lokal. Butuh file .env (salin dari .env.example).
# Nama project tetap: kontainer kompakapps-odoo-1 dan volume kompakapps_db-data, apa pun nama folder kerjanya.
name: kompakapps
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ODOO_VERSION: ${ODOO_VERSION:-19.0}
    image: kompakapps:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${DB_PASSWORD}
      ADMIN_PASSWD: ${ADMIN_PASSWD:?Isi ADMIN_PASSWD di file .env}
    # Hanya dari Mac ini (bukan jaringan Wi-Fi/LAN), karena database baru masih memakai login admin/admin.
    ports:
      - "127.0.0.1:${ODOO_PORT:-8069}:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      # Modul KompakApps dipasang dari folder lokal agar perubahan langsung terlihat.
      - ./addons:/mnt/extra-addons
    # Database manager dimatikan (list_db = False); database dibuat lewat perintah, lihat README.
    command: odoo --database=${ODOO_DB:-kompakapps}

  # UI KompakApps yang terhubung ke Odoo (uji kelayakan). Hanya untuk pengembangan lokal.
  # Menyajikan ui/live dan meneruskan /json/2/ ke Odoo pada alamat yang sama (tanpa CORS).
  ui:
    image: nginx:1.27-alpine
    depends_on:
      - odoo
    environment:
      ODOO_UPSTREAM: odoo:8069
      ODOO_DB: ${ODOO_DB:-kompakapps}
    ports:
      - "127.0.0.1:${UI_PORT:-8080}:80"
    volumes:
      - ./ui/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./ui/live:/usr/share/nginx/html:ro

volumes:
  db-data:
  odoo-data:
