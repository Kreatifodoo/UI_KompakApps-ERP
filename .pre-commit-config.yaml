# Prototipe UI lama (hasil generate dan generate_forms.py) dikecualikan; semuanya diganti di Fase 2.
exclude: ^(forms/|index\.html$|Business_Form_Template\.html$|nusara_erp_system\.html$|generate_forms\.py$)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
